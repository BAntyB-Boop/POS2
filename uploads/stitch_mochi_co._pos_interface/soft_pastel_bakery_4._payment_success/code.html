<div class="font-headline-md text-headline-md text-secondary mt-1">
                    Change ฿60
                </div>
</div>
</div>
<!-- Receipt Preview (Torn Paper Effect) -->
<div class="w-full bg-surface-container-lowest rounded-t-xl shadow-[0_8px_24px_rgba(58,42,34,0.06)] relative animate-slide-up" style="animation-delay: 0.1s;">

<!-- Receipt Items Mock -->
<div class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
<span>Strawberry Mochi x 2</span>
<span class="font-label-bold text-label-bold text-on-surface">฿120</span>
</div>
<div class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
<span>Matcha Roll Cake x 1</span>
<span class="font-label-bold text-label-bold text-on-surface">฿60</span>
</div>
<hr class="border-t-2 border-dashed border-outline-variant my-xs"/>
<div class="flex justify-between items-center">
<span class="font-body-lg text-body-lg text-on-surface">Total</span>
<span class="font-headline-md text-headline-md text-primary">฿180</span>
</div>
</div>
