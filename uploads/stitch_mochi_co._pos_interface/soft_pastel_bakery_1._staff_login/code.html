<!-- Row 4 -->
<button class="w-full aspect-square rounded-full bg-surface-container-highest text-on-surface-variant font-label-bold text-label-bold squishy-shadow flex items-center justify-center" onclick="clearPin()">Clear</button>
<button class="w-full aspect-square rounded-full bg-surface text-primary font-display-price text-display-price squishy-shadow flex items-center justify-center border-2 border-surface-container-highest" onclick="enterPin()">0</button>

<script>
        let pinCount = 0;
        
        function selectAvatar(btn) {
            // Remove selection from all
            document.querySelectorAll('button > div.w-20').forEach(div => {
                div.classList.remove('border-primary-container', 'bg-surface-container-low');
                div.classList.add('border-surface-container-highest', 'bg-surface-container');
            });
            // Add to clicked
            const avatarDiv = btn.querySelector('div');
            avatarDiv.classList.remove('border-surface-container-highest', 'bg-surface-container');
            avatarDiv.classList.add('border-primary-container', 'bg-surface-container-low');
        }

        function enterPin() {
            if (pinCount < 4) {
                pinCount++;
                document.getElementById(`pin-dot-${pinCount}`).classList.replace('bg-surface-container-highest', 'bg-primary');
                document.getElementById(`pin-dot-${pinCount}`).classList.replace('shadow-inner', 'shadow-none');
            }
        }

        function clearPin() {
            pinCount = 0;
            for(let i=1; i<=4; i++) {
                document.getElementById(`pin-dot-${i}`).classList.replace('bg-primary', 'bg-surface-container-highest');
                document.getElementById(`pin-dot-${i}`).classList.add('shadow-inner');
            }
        }

        function submitPin() {
            if (pinCount === 4) {
                // Flash success
                const dots = [1,2,3,4].map(i => document.getElementById(`pin-dot-${i}`));
                dots.forEach(d => d.classList.replace('bg-primary', 'bg-secondary'));
                setTimeout(() => {
                    clearPin();
                }, 500);
            } else {
                // Shake error
                const container = document.querySelector('.flex.gap-md.mb-md');
                container.style.transform = 'translateX(-10px)';
                setTimeout(() => container.style.transform = 'translateX(10px)', 50);
                setTimeout(() => container.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => container.style.transform = 'translateX(10px)', 150);
                setTimeout(() => container.style.transform = 'translateX(0)', 200);
                setTimeout(clearPin, 400);
            }
        }
    </script>
